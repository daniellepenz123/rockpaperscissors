<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock, Paper, Scissors Game</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header>
      <img
        src="images/rockpaperscissorsicon.png"
        alt="Rock, paper, and scissors illustration"
      />
      <h1>ROCK • PAPER • SCISSORS</h1>
      <p>A classic game of chance.</p>
    </header>

    <form id="gameForm">
      <label for="userChoice">What do you choose?</label>
      <select id="userChoice">
        <option value="rock">Rock</option>
        <option value="paper">Paper</option>
        <option value="scissors">Scissors</option>
      </select>
      <button type="submit">Submit</button>
    </form>

    <div id="gameResults">
      <p id="playerResult">Choose rock, paper, or scissors to start!</p>
      <p id="computerResult"></p>
      <p id="winnerResult"></p>
    </div>

    <div id="scoreboard">
      <p>Wins: <span id="wins">0</span></p>
      <p>Losses: <span id="losses">0</span></p>
      <p>Ties: <span id="ties">0</span></p>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
